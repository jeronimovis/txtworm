<style>
/* =====================================================================
   TXTworm
   ---------------------------------------------------------------------
   The page has two layers:
     1. LAYOUT (this block): structure only. It never names a font or a
        colour; it reads design tokens (CSS variables) instead.
     2. STYLES (next block): each style sets the tokens, and may add its
        own rules. Switching style never changes how the page works.
   ===================================================================== */

/* ---------- Fallback tokens (any style can override them) ---------- */
:root{
  --bg:#f3f0e8; --paper:#fffdf8; --ink:#1f1c18; --muted:#7c7468; --rule:#ddd5c6; --accent:#8a2e1e;
  --chrome:rgba(255,253,248,.88); --shadow:0 1px 2px rgba(40,30,10,.06),0 10px 34px rgba(60,40,10,.12);

  --font-body:Georgia,serif; --font-display:var(--font-body); --font-ui:var(--font-body); --font-label:var(--font-body);
  --text-scale:1; --leading:1.55; --indent:1.5em; --measure:33em; --para-gap:0;

  --title-size:2.7em; --title-weight:500; --title-case:none; --title-spacing:.005em;
  --head-weight:500; --chapter-title-size:1.9em;
  --dropcap-font:var(--font-display); --dropcap-size:4.15em; --dropcap-weight:500; --dropcap-color:var(--accent);
  --dropcap-firstline:small-caps;

  --orn-char:"◆"; --break-char:"⁂"; --fin-char:"❦";

  /* A5 page margins (inner = gutter side) */
  --pm-top:19mm; --pm-bottom:19mm; --pm-inner:17mm; --pm-outer:15mm;

  /* set by the script */
  --fs:20px; --fsA5:11pt; --s:1;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121110; --paper:#1c1a17; --ink:#e7e0d2; --muted:#9b9285; --rule:#3a352e; --accent:#d9906f;
  --chrome:rgba(28,26,23,.88); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
  transition:background .3s,color .3s;min-height:100vh}
body.a5{background:var(--bg)}
[hidden]{display:none!important}

/* ---------- Toolbar ---------- */
.bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
  background:var(--chrome);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--rule);box-shadow:0 4px 18px rgba(0,0,0,.08);
  font-family:var(--font-ui);transition:transform .35s ease,opacity .35s ease;white-space:nowrap}
.bar.hidden{transform:translate(-50%,-160%);opacity:0}
.bar button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;
  height:32px;min-width:32px;padding:0 11px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.02em}
.bar button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.bar .sep{width:1px;height:18px;background:var(--rule);margin:0 4px}
.bar .seg{display:flex;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:999px}
.bar .size{font-variant-numeric:lining-nums;font-size:13px;color:var(--muted);min-width:34px;text-align:center}
.bar svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bar .sc{font-variant:small-caps;letter-spacing:.06em}
@media (max-width:560px){ .bar .hide-sm{display:none} .bar button{padding:0 8px} }
.menu{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:11;display:flex;flex-wrap:wrap;justify-content:center;
  gap:2px;padding:5px;border-radius:18px;max-width:calc(100vw - 24px);
  background:var(--chrome);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--rule);box-shadow:0 4px 18px rgba(0,0,0,.1);font-family:var(--font-ui)}
.menu button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;height:32px;padding:0 13px;
  border-radius:999px;cursor:pointer}
.menu button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.menu button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* ---------- Prose ---------- */
.prose{line-height:var(--leading);text-align:justify;hyphens:auto;-webkit-hyphens:auto;
  font-kerning:normal;font-feature-settings:"kern","liga","onum";
  overflow-wrap:break-word;text-rendering:optimizeLegibility}
.prose p{margin:var(--para-gap) 0 0;text-indent:var(--indent)}
.prose > p:first-child,
.prose :is(h1,h2,h3,h4,h5,h6,hr,blockquote,ul,ol,pre,header,figure,.missing,.toc-item) + p,
.prose p.dropcap,.prose p.cont{text-indent:0}
.prose p.split{text-align-last:justify}
.prose p.cont{margin-top:0}
.pad{display:none}   /* "0" before one-digit chapter numbers; a style can show it */
.author{font-family:var(--font-label)}
.prose p.dropcap{display:flow-root}
.prose p.dropcap::first-letter{float:left;font-family:var(--dropcap-font);font-weight:var(--dropcap-weight);
  font-size:var(--dropcap-size);line-height:.78;margin:.07em .07em -.05em 0;padding-top:.02em;color:var(--dropcap-color)}
.prose p.dropcap::first-line{font-variant-caps:var(--dropcap-firstline);letter-spacing:.04em}
.prose > :is(h1,h2){font-family:var(--font-display);font-weight:var(--head-weight);font-size:1.55em;line-height:1.15;
  text-align:center;margin:1.6em 0 .8em;hyphens:none;text-wrap:balance}
.prose > h3{font-weight:400;font-style:italic;font-size:1.15em;text-align:center;margin:1.4em 0 .6em;hyphens:none}
.prose > :is(h4,h5,h6){font-weight:500;font-size:1em;font-variant:small-caps;letter-spacing:.06em;margin:1.2em 0 .4em;text-align:left}
.prose blockquote{margin:1em 1.6em;font-style:italic}
.prose blockquote p{text-indent:0}
.prose blockquote p + p{margin-top:.5em}
.prose :is(ul,ol){margin:.7em 0;padding-left:1.6em;text-align:left}
.prose li{margin:.15em 0}
.prose li.cont-li{list-style:none}
.prose hr{border:0;margin:1.1em 0;height:1.5em;text-align:center;overflow:visible}
.prose hr::before{content:var(--break-char);color:var(--muted);font-size:1.05em;line-height:1.5em}
.prose pre{font-size:.8em;line-height:1.45;white-space:pre-wrap;text-align:left;hyphens:none;
  background:color-mix(in srgb,var(--ink) 5%,transparent);padding:.8em 1em;border-radius:4px;margin:1em 0}
.prose code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.85em}
.prose pre code{font-size:1em}
.prose a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:.15em}
.prose strong{font-weight:600}
.prose .fin{text-align:center;color:var(--accent);margin-top:1.4em;font-size:1.1em;text-indent:0}
.prose .fin::before{content:var(--fin-char)}

/* ---------- Images ---------- */
figure{margin:0}
figure.pic{margin:1.3em 0;text-align:center}
figure.pic img{display:block;width:auto;height:auto;max-width:100%;margin:0 auto}
figure.pic figcaption,figure.cover figcaption{font-style:italic;color:var(--muted);font-size:.85em;line-height:1.4;
  margin-top:.55em;text-align:center;hyphens:none;text-indent:0}
figure.cover img,figure.chapter-cover img{display:block;width:100%;height:auto}
.prose img{max-width:100%}
.missing{color:var(--muted);font-style:italic;text-align:center;font-size:.85em;line-height:1.4;
  border:1px dashed var(--rule);border-radius:4px;padding:.7em;margin:1em 0;text-indent:0;hyphens:none}

/* ---------- Title block ---------- */
.titleblock{text-align:center;margin:0 0 2.4em;hyphens:none}
.titleblock .title{font-family:var(--font-display);font-weight:var(--title-weight);font-size:var(--title-size);line-height:1.04;
  letter-spacing:var(--title-spacing);text-transform:var(--title-case);margin:0;text-wrap:balance}
.titleblock .subtitle{font-family:var(--font-display);font-style:italic;font-size:1.3em;line-height:1.25;
  color:var(--muted);margin:.45em 0 0;text-indent:0;text-align:center;text-wrap:balance}
.orn{display:flex;align-items:center;justify-content:center;gap:.7em;
  color:var(--accent);width:min(11em,60%);margin:1.1em auto 0}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:currentColor;opacity:.45}
.orn span{font-size:.55em;line-height:1}
.orn span::before{content:var(--orn-char)}
.titleblock .author{font-variant:small-caps;letter-spacing:.14em;font-size:.95em;color:var(--muted);
  margin:1em 0 0;text-indent:0;text-align:center}

/* ---------- Chapter opening ---------- */
.chapter-head{text-align:center;margin:0 0 2.2em;hyphens:none}
.chapter-num{font-family:var(--font-display);color:var(--accent);font-size:1.15em;letter-spacing:.18em;
  margin:0 0 .35em;text-indent:0;text-align:center;font-feature-settings:"lnum"}
.chapter-title{font-family:var(--font-display);font-weight:var(--head-weight);font-size:var(--chapter-title-size);
  line-height:1.1;margin:0;text-wrap:balance}
.chapter-head .subtitle{font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:1.15em;
  margin:.35em 0 0;text-indent:0;text-align:center}
.chapter-head .author{font-variant:small-caps;letter-spacing:.12em;color:var(--muted);font-size:.9em;
  margin:.7em 0 0;text-indent:0;text-align:center}
.chapter-head .orn{margin-top:.9em;width:min(6em,40%)}
.chapter-cover{margin:0 0 2em}

/* ---------- Contents ---------- */
.toc-heading{font-family:var(--font-display);font-weight:var(--head-weight);font-size:1.55em;text-align:center;
  margin:0 0 1.1em;hyphens:none}
.toc-item{text-indent:0;text-align:left;hyphens:none;margin:0 0 .55em;line-height:1.35}
.toc-row{display:flex;align-items:baseline;gap:.55em;color:inherit;text-decoration:none}
a.toc-row:hover .toc-title{color:var(--accent)}
.toc-num{flex:none;min-width:1.7em;color:var(--accent);font-feature-settings:"lnum";font-family:var(--font-display);font-size:1.05em}
.toc-title{flex:0 1 auto}
.toc-dots{flex:1 1 1em;min-width:1em;border-bottom:1px dotted var(--muted);opacity:.55;transform:translateY(-.28em)}
.toc-page{flex:none;color:var(--muted);font-feature-settings:"lnum"}
.toc-missing .toc-title{color:var(--muted)}
.toc-note{font-size:.85em;color:var(--muted)}
.notice{color:var(--muted);font-style:italic;text-align:center;font-size:.9em;margin:1.6em 0 0;text-indent:0;hyphens:none}

/* ---------- Continuous layout ---------- */
#column{font-size:calc(var(--fs) * var(--text-scale));max-width:var(--measure);margin:0 auto;padding:7.5rem 1.4rem 7rem}
#column > .titleblock{margin:1.5em 0 2.6em}
#column > .titleblock .title{font-size:calc(var(--title-size) * 1.11)}
#column > figure.cover{margin:0 0 3.2em}
#column .toc{margin:3.5em 0 1em}
#column .toc-dots,#column .toc-page{display:none}
#column .chapter{padding-top:7em}
#column .chapter-head{margin-bottom:2.6em}

/* ---------- A5 pages ---------- */
#pages{padding:84px 0 60px}
.slot{width:calc(148mm * var(--s));height:calc(210mm * var(--s));margin:0 auto 26px;position:relative;scroll-margin-top:70px}
.page{--body-h:calc(210mm - var(--pm-top) - var(--pm-bottom));
  position:absolute;top:0;left:0;width:148mm;height:210mm;background:var(--paper);
  box-shadow:var(--shadow);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;transition:background .3s}
.page-body{position:absolute;top:var(--pm-top);bottom:var(--pm-bottom);left:var(--pm-inner);right:var(--pm-outer);
  overflow:hidden;font-size:calc(var(--fsA5) * var(--text-scale))}
.page.verso .page-body{left:var(--pm-outer);right:var(--pm-inner)}
.page-head,.page-num{position:absolute;left:0;right:0;text-align:center;color:var(--muted);font-family:var(--font-label);
  font-size:calc(var(--fsA5) * .78);letter-spacing:.12em;font-variant:small-caps;font-feature-settings:"onum"}
.page-head{top:calc(var(--pm-top) * .5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 22mm}
.page-num{bottom:calc(var(--pm-bottom) * .47);letter-spacing:.04em;font-size:calc(var(--fsA5) * .85)}
.page[data-first] > .page-body > .titleblock:first-child{margin-top:16mm;margin-bottom:9mm}
.page.title-page .page-body{display:flex;flex-direction:column;justify-content:center}
.page.title-page .titleblock{margin:0 0 18mm;font-size:1.15em}
.page.cover-page .page-body{display:flex;align-items:center;justify-content:center}
.page.cover-page figure.cover{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}
.page.cover-page figure.cover img{width:100%;height:auto;max-height:100%;object-fit:contain;min-height:0}
.page .chapter-cover img{max-height:calc(var(--body-h) * .62);object-fit:contain}
.page figure.pic img{max-height:calc(var(--body-h) * .8)}
/* full-page images: no margins, no running head, no folio (the page still counts) */
.page.plate .page-body{top:0;bottom:0;left:0;right:0;display:block}
.page.plate figure.fullpage{width:100%;height:100%;margin:0;display:block}
.page.plate figure.fullpage img{width:100%;height:100%;max-height:none;object-fit:cover}
.page.plate figcaption,.page.plate .page-head,.page.plate .page-num{display:none}
.prose p.brk{text-indent:0;margin-top:0}
.page .chapter-head{padding-top:16mm;margin-bottom:9mm}
.page .chapter-cover + .chapter-head{padding-top:2mm;margin-bottom:6mm}
.page .toc-heading{padding-top:16mm;margin-bottom:8mm}

/* ---------- Welcome & drop ---------- */
#welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;gap:.2rem}
#welcome h1{font-family:var(--font-display);font-weight:var(--title-weight);font-size:clamp(2.6rem,7vw,4.4rem);margin:0;line-height:1}
#welcome p{color:var(--muted);font-size:1.2rem;font-style:italic;margin:.6rem 0 1.6rem}
#welcome .actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
#welcome button{font:inherit;font-size:1.05rem;padding:.55em 1.3em;border-radius:999px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
#welcome button.ghost{background:none;color:var(--ink);border-color:var(--rule)}
#welcome small{display:block;margin-top:2rem;color:var(--muted);font-size:.95rem;letter-spacing:.02em;max-width:34em;line-height:1.5}
#welcome .msg{color:var(--accent);font-style:normal;font-size:1rem;margin:1.2rem 0 0}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-style:italic;font-size:1.1rem;opacity:0;animation:fadein .3s .5s forwards}
@keyframes fadein{to{opacity:1}}
.drop::after{content:"Drop to read";position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2.2rem;
  color:var(--accent);background:color-mix(in srgb,var(--paper) 85%,transparent);z-index:20}

/* ---------- Print ---------- */
@media print{
  :root,:root[data-theme=dark]{--bg:#fff;--paper:#fff;--ink:#000;--muted:#555;--rule:#ccc;--s:1!important}
  .bar{display:none}
  body,body.a5{background:#fff}
  #pages{padding:0}
  .slot{margin:0;break-after:page;page-break-after:always}
  .slot:last-child{break-after:auto}
  .page{box-shadow:none;transform:none}
  #column{padding:0}
  #column .chapter{break-before:page;padding-top:0}
  #column .toc{break-before:page}
}
@page{size:A5;margin:0}
</style>

<style>
/* =====================================================================
   STYLES
   ---------------------------------------------------------------------
   HOW TO ADD A STYLE
   1. Copy one of the blocks below and rename it, e.g. "poster":
        :root[data-style=poster]{ ... }
        :root[data-style=poster][data-theme=dark]{ ... }
      Change any tokens (fonts, colours, sizes, ornaments, page margins).
      You can also add rules of its own, e.g.
        :root[data-style=poster] .chapter-num{ font-family:var(--font-body) }
   2. Register it in STYLES at the top of the script: a label, an optional
      Google Fonts URL and the fonts to wait for before measuring pages.
   3. Done. It appears in the toolbar's Aa menu, and a story or book can
      ask for it in its header:  style: poster
   Pages are measured from the real rendered text, so any font or size works.

   Tokens you will most often change:
     --font-body --font-display --font-label   text, titles, small labels
     --paper --ink --muted --rule --accent --bg colours (--bg is behind A5 pages)
     --text-scale  makes the whole text bigger or smaller (sans fonts look larger)
     --indent --para-gap --leading             paragraph shape
     --orn-char --break-char --fin-char        title ornament, scene break, end mark
   ===================================================================== */

/* ---------- STYLE: book — a classic printed book ---------- */
:root[data-style=book]{
  --font-body:"EB Garamond",Garamond,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-display:"Cormorant Garamond","EB Garamond",Garamond,Georgia,serif;
  --bg:#f3f0e8; --paper:#fffdf8; --ink:#1f1c18; --muted:#7c7468; --rule:#ddd5c6; --accent:#8a2e1e;
  --chrome:rgba(255,253,248,.88);
  --orn-char:"◆"; --break-char:"⁂"; --fin-char:"❦";
}
:root[data-style=book][data-theme=dark]{
  --bg:#121110; --paper:#1c1a17; --ink:#e7e0d2; --muted:#9b9285; --rule:#3a352e; --accent:#d9906f;
  --chrome:rgba(28,26,23,.88);
}

/* ---------- STYLE: academic — a scholarly edition ---------- */
:root[data-style=academic]{
  --font-body:"Crimson Pro","Iowan Old Style",Georgia,serif; --font-display:var(--font-body); --font-label:var(--font-body);
  --bg:#e9e8e4; --paper:#ffffff; --ink:#151515; --muted:#5d5d5d; --rule:#d7d4ce; --accent:#1f3a6b;
  --chrome:rgba(255,255,255,.9);
  --text-scale:1.06; --leading:1.5; --indent:1.6em; --measure:31em;
  --title-size:2.35em; --title-weight:500; --head-weight:600; --chapter-title-size:1.55em;
  --orn-char:""; --break-char:"*\2003*\2003*"; --fin-char:"∎";
  --pm-top:22mm; --pm-bottom:21mm; --pm-inner:19mm; --pm-outer:16mm;
}
:root[data-style=academic][data-theme=dark]{

<script>
(() => {
"use strict";

/* =====================================================================
   STYLES REGISTRY
   Each key must match a  :root[data-style=KEY]  block in the CSS.
   fonts:   optional stylesheet URL (loaded only when the style is used)
   preload: fonts to wait for before measuring A5 pages
   ===================================================================== */
const GF = "https://fonts.googleapis.com/css2?";
const STYLES = {
  book: {
    label: "Book",
    fonts: GF + "family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap",
    preload: ['400 16px "EB Garamond"','italic 400 16px "EB Garamond"','600 16px "EB Garamond"',
              '500 16px "Cormorant Garamond"','italic 500 16px "Cormorant Garamond"'],
  },
  academic: {
    label: "Academic",
    fonts: GF + "family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap",
    preload: ['400 16px "Crimson Pro"','italic 400 16px "Crimson Pro"','600 16px "Crimson Pro"'],
  },
  editorial: {
    label: "Editorial",
    fonts: GF + "family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Libre+Franklin:wght@400;600;700&display=swap",
    preload: ['400 16px "Source Serif 4"','italic 400 16px "Source Serif 4"','600 16px "Fraunces"','italic 400 16px "Fraunces"','700 16px "Fraunces"','600 16px "Libre Franklin"'],
  },
  concrete: {
    label: "Concrete",
    fonts: GF + "family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap",
    preload: ['400 16px "Space Grotesk"','700 16px "Space Grotesk"','700 16px "JetBrains Mono"','400 16px "JetBrains Mono"'],
  },
  modern: {
    label: "Modern",
    fonts: GF + "family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap",
    preload: ['400 16px "Figtree"','italic 400 16px "Figtree"','600 16px "Figtree"','800 16px "Bricolage Grotesque"','700 16px "Bricolage Grotesque"'],
  },
};
const DEFAULT_STYLE = "book";
const STYLE_ALIASES = { classic: "book" };   // older names still work

/* Words the page itself writes, by language of the text */
const WORDS = {
  en: { contents:"Contents", chapter:"Chapter", missing:"missing" },
  es: { contents:"Índice",   chapter:"Capítulo", missing:"falta" },
};

const $ = s => document.querySelector(s);
const root = document.documentElement;
const SIZES_PX = [15,16,17,18,19,20,21,22,24,26,28,30];
const SIZES_PT = [8.5,9,9.5,10,10.5,11,11.5,12,13,14,15,16];
const DEFAULT_SIZE = 5;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Persistence (best effort) ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const st = Object.assign({ mode:"scroll", size:DEFAULT_SIZE, theme:null, style:null }, store.get("reader.settings") || {});
st.size = Math.max(0, Math.min(SIZES_PX.length-1, st.size|0));
const saveSettings = () => store.set("reader.settings", st);

let doc = null;      // what is open: {kind:"single"|"book", ...}
let source = null;   // where its files come from

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const prettyName = n => decodeURIComponent((n||"").split("/").filter(Boolean).pop() || "")
  .replace(/\.[^.]+$/,"").replace(/[-_]+/g," ").replace(/\s+/g," ").trim().replace(/^./, c => c.toUpperCase());
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
const textOf = html => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.trim(); };
const encodePath = p => p.split("/").map(encodeURIComponent).join("/");
const IMG_EXT = /\.(png|jpe?g|gif|webp|svg|avif)$/i;

/* =====================================================================
   TEXT → HTML
   ===================================================================== */
function inline(s){
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_,c) => { codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;.*?&quot;)?\)/g, '<img alt="$1" data-src="$2">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;.*?&quot;)?\)/g, '<a href="$2">$1</a>');
  s = s.replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>");
  s = s.replace(/\*(?=\S)([\s\S]*?\S)\*/g, "<em>$1</em>");
  s = s.replace(/(^|[^\w])_(?=\S)([\s\S]*?\S)_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
  s = s.replace(/\u0000(\d+)\u0000/g, (_,n) => "<code>"+esc(codes[n])+"</code>");
  return s;
}

/* Image tags, each alone on its line:
     [img map.png]   [img map.png "Caption"]   [map.png]   [map.png "Caption"]   ![alt](map.png "Caption") */
function imageTag(line){
  let m = line.match(/^\s*\[img\s+([^\s\]"]+)(?:\s+"([^"]*)")?\s*\]\s*$/i);
  if (!m){ m = line.match(/^\s*\[([^\s\]"]+)(?:\s+"([^"]*)")?\s*\]\s*$/); if (m && !IMG_EXT.test(m[1])) m = null; }
  if (m) return { src:m[1], caption:m[2]||"", alt:m[2]||"" };
  m = line.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)\s*$/);
  return m ? { src:m[2], caption:m[3]||"", alt:m[1]||m[3]||"" } : null;
}
const figHtml = t => `<figure class="pic" data-src="${esc(t.src)}" data-alt="${esc(t.alt)}">`
  + (t.caption ? `<figcaption>${inline(t.caption)}</figcaption>` : "") + `</figure>`;

const HR = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const LIST = /^\s*([-*+]|\d+[.)])\s+(.*)$/;
const isBlockStart = l => /^(#{1,6}\s|```|~~~|\s*>)/.test(l) || HR.test(l) || LIST.test(l) || !!imageTag(l);

/* Hard-wrapped text (e.g. Project Gutenberg): fixed-width lines, paragraphs separated by blank lines. */
function isHardWrapped(src){
  const lines = src.split("\n").map(l => l.trim()).filter(l => l && !/^(#|>|[-*+]\s|\d+[.)]\s|\[|!\[|```)/.test(l));
  if (!/\n\s*\n/.test(src.trim()) || !lines.length) return false;
  const lens = lines.map(l => l.length);
  return Math.max(...lens) <= 85 && lens.filter(n => n >= 50 && n <= 82).length / lens.length > 0.5;
}

/* Fiction is usually written one paragraph per line, so (unlike strict Markdown)
   every line is its own paragraph — unless the file is hard-wrapped. */
function mdToHtml(src, onePerLine = !isHardWrapped(src)){
  const lines = src.split("\n"); const out = []; let i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (!line.trim()){ i++; continue; }
    let m, t;
    if ((m = line.match(/^(```|~~~)/))){
      const fence = m[1], buf = []; i++;
      while (i < lines.length && !lines[i].startsWith(fence)) buf.push(lines[i++]);
      i++; out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); continue;
    }
    if ((t = imageTag(line))){ out.push(figHtml(t)); i++; continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){
      const n = m[1].length; out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue;
    }
    if (HR.test(line)){ out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)){
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*> ?/,""));
      out.push("<blockquote>"+mdToHtml(buf.join("\n"), onePerLine)+"</blockquote>"); continue;
    }
    if ((m = line.match(LIST))){
      const ordered = /\d/.test(m[1]); const start = ordered ? parseInt(m[1],10) : 1; const items = [];
      while (i < lines.length){
        const mm = lines[i].match(LIST);
        if (mm && /\d/.test(mm[1]) === ordered){ items.push(mm[2]); i++; }
        else if (items.length && lines[i].trim() && /^\s+/.test(lines[i]) && !mm){ items[items.length-1] += " "+lines[i].trim(); i++; }
        else break;
      }
      const lis = items.map(x => "<li>"+inline(x)+"</li>").join("");
      out.push(ordered ? `<ol${start!==1?` start="${start}"`:""}>${lis}</ol>` : `<ul>${lis}</ul>`);
      continue;
    }
    const buf = []; let heading = 0;
    while (i < lines.length && lines[i].trim()){
      if (buf.length && /^=+\s*$/.test(lines[i])){ heading = 1; i++; break; }
      if (buf.length && !onePerLine && /^-+\s*$/.test(lines[i])){ heading = 2; i++; break; }
      if (buf.length && (onePerLine || isBlockStart(lines[i]))) break;
      buf.push(lines[i++]);
    }
    if (heading){ out.push(`<h${heading}>${inline(buf.join(" "))}</h${heading}>`); continue; }
    const html = inline(buf.join("\n")).replace(/( {2,}|\\)\n/g,"<br>").replace(/\n/g," ");
    out.push("<p>"+html+"</p>");
  }
  return out.join("\n");
}

function txtToHtml(src){
  const lines = src.split("\n").map(l => l.trim()).filter(Boolean);
  const blocks = isHardWrapped(src)
    ? src.split(/\n\s*\n/).map(b => b.trim().replace(/\s*\n\s*/g," ")).filter(Boolean)
    : lines; // otherwise every line is its own paragraph
  return blocks.map(b => {
    const t = imageTag(b);
    if (t) return figHtml(t);
    return /^(\*\s*){3,}$|^(-\s*){3,}$|^#$/.test(b) ? "<hr>" : "<p>"+esc(b)+"</p>";
  }).join("\n");
}

/* ---------- Typography polish ---------- */
const smartStr = s => s
  .replace(/\.\.\./g,"…").replace(/---/g,"—").replace(/--/g,"—").replace(/ - /g," – ")
  .replace(/(^|[\s(\[{—–\-])"/g,"$1“").replace(/"/g,"”")
  .replace(/(^|[\s(\[{—–\-])'/g,"$1‘").replace(/'/g,"’");
function smarten(node){
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement?.closest("pre,code") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  let t; while ((t = w.nextNode())) t.nodeValue = smartStr(t.nodeValue);
}
const plainHtml = s => esc(smartStr(String(s).trim()));
function detectLang(text){
  const sample = " "+text.slice(0,8000).toLowerCase()+" ";
  const count = re => (sample.match(re)||[]).length;
  const es = count(/\s(el|la|los|las|que|de|y|en|un|una|por|con|para|es|se|no|del|lo)\s/g);
  const en = count(/\s(the|and|of|to|is|that|in|it|you|was|he|she|for|with|on)\s/g);
  return es > en ? "es" : "en";
}
const words = lang => WORDS[lang] || WORDS.en;

function frontMatter(text){
  const meta = {};
  text = text.replace(/^﻿/,"").replace(/\r\n?/g,"\n");
  const fm = text.match(/^---\n([\s\S]*?)\n---\n?/);
  if (fm){
    fm[1].split("\n").forEach(l => { const m = l.match(/^(\w+)\s*:\s*(.*)$/); if (m) meta[m[1].toLowerCase()] = m[2].trim().replace(/^["']|["']$/g,""); });
    text = text.slice(fm[0].length);
  }
  return { meta, text };
}

/* ---------- One story (or one chapter) ---------- */
function parseDoc(raw, name, o = {}){
  const { meta, text } = frontMatter(raw);
  const isTxt = /\.te?xt$/i.test(name||"");
  const tpl = document.createElement("template");
  tpl.innerHTML = isTxt ? txtToHtml(text) : mdToHtml(text);
  const frag = tpl.content;
  smarten(frag);

  const first = () => frag.firstElementChild;
  const taken = [];
  const take = () => { const e = first(); e.remove(); taken.push(e); return e; };
  let title = meta.title ? plainHtml(meta.title) : null, from = title ? "meta" : null;
  let subtitle = meta.subtitle ? plainHtml(meta.subtitle) : null;
  let author = meta.author ? plainHtml(meta.author) : null;

  if (!title && first()){
    const f = first(), t = f.textContent.trim();
    if (f.tagName === "H1" || (o.firstLineTitle && /^H[2-6]$/.test(f.tagName))){ title = take().innerHTML; from = "doc"; }
    else if (f.tagName === "P"){
      const looksTitle = t.length <= 90 && !/[.!?…:;,]$/.test(t) && frag.children.length > 1;
      if ((isTxt && looksTitle) || (o.firstLineTitle && t.length <= 120)){ title = take().innerHTML; from = "doc"; }
    }
  }
  if (from === "doc"){
    const f = first();
    if (!subtitle && f && f.tagName === "P" && f.childNodes.length === 1 && f.firstChild.nodeName === "EM"){ subtitle = take().firstChild.innerHTML; }
    const g = first();
    if (!author && g && g.tagName === "P" && /^(by|por)\s+\S/i.test(g.textContent.trim()) && g.textContent.length < 80){
      author = take().innerHTML.replace(/^\s*(by|por)\s+/i,"");
    }
  }
  // A chapter named in the contents list: if the file's first lines were not that same title, give them back.
  if (o.forcedTitle){
    if (from === "doc" && !norm(textOf(title)).includes(norm(o.forcedTitle))){
      for (let k = taken.length - 1; k >= 0; k--) frag.prepend(taken[k]);
      subtitle = meta.subtitle ? plainHtml(meta.subtitle) : null;
      author = meta.author ? plainHtml(meta.author) : null;
    }
    title = plainHtml(o.forcedTitle);
  }
  if (!title) title = esc(o.fallbackTitle || prettyName(name) || "Untitled");
  return { title, subtitle, author, titleText: textOf(title), frag, style: meta.style, text };
}

/* ---------- A book's contents / title file ----------
   First line: the title. Then optional subtitle and "By …" lines.
   Then a list: "1. Name", "01) Name", "A. Name", "IV. Name" or "- Name".        */
function parseContents(raw){
  const { meta: fm, text } = frontMatter(raw);
  const meta = { title: fm.title || null, subtitle: fm.subtitle || null, author: fm.author || null, style: fm.style || null };
  const strip = s => s.replace(/^[*_]+|[*_]+$/g,"").trim();
  const items = [];
  for (const raw of text.split("\n")){
    const line = raw.trim().replace(/^#{1,6}\s+/, "");
    if (!line) continue;
    if (!meta.title){ meta.title = strip(line); continue; }
    const m = line.match(/^(\d{1,3}|[a-zA-Z]|[ivxlc]{1,6}|[IVXLC]{1,6})[.)]\s+(.+)$/);
    const b = line.match(/^[-*+•]\s+(.+)$/);
    if (m) items.push({ label: m[1].replace(/^0+(?=\d)/,""), title: strip(m[2]) });
    else if (b) items.push({ label: null, title: strip(b[1]) });
    else if (!items.length){
      if (/^(by|por)\s+\S/i.test(line)) meta.author = strip(line.replace(/^(by|por)\s+/i,""));
      else if (!meta.subtitle) meta.subtitle = strip(line);
    }
  }
  return { meta, items };
}

/* =====================================================================
   SOURCES — where files come from.
   Every source answers: text(path) → string|null, image(path) → {url,w,h}|null
   ===================================================================== */
function probeImage(url){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res({ url, w: im.naturalWidth || 1, h: im.naturalHeight || 1 });
    im.onerror = () => res(null);
    im.src = url;
  });
}

/* A website (or this page's own folder) */
function webSource(){
  const dir = location.pathname.replace(/[^/]*$/, "");
  return {
    kind: "web",
    name: prettyName(dir),
    async text(path){
      try{
        const r = await fetch(encodePath(path), { cache:"no-cache" });
        if (!r.ok) return null;
        const t = await r.text();
        if (/^\s*<(!doctype|html)/i.test(t)) return null;   // a server's "not found" page
        return t;
      }catch{ return null; }
    },
    image: path => probeImage(encodePath(path)),
  };
}

/* Files the reader opened or dropped: [{path, file}] */
function fileSource(entries, name){
  const map = new Map(), lower = new Map(), urls = [];
  entries.forEach(({ path, file }) => { map.set(path, file); lower.set(path.toLowerCase(), file); });
  const get = p => map.get(p) || lower.get(p.toLowerCase());
  const blobs = new Map();
  return {
    kind: "files", name: prettyName(name || ""),
    async text(p){ const f = get(p); return f ? await f.text() : null; },
    async image(p){
      const f = get(p); if (!f) return null;
      let u = blobs.get(f); if (!u){ u = URL.createObjectURL(f); blobs.set(f, u); urls.push(u); }
      return probeImage(u);
    },
    paths: () => [...map.keys()],
    close(){ urls.forEach(u => URL.revokeObjectURL(u)); }
  };
}

/* Fixed text kept in the browser (last story read, or the sample) */
function memorySource(){ return { kind:"memory", name:"", text: async () => null, image: async () => null }; }

/* ---------- Finding things inside a source ---------- */
async function findText(src, names){
  const got = await Promise.all(names.map(n => src.text(n)));
  const k = got.findIndex(t => t != null);
  return k < 0 ? null : { text: got[k], name: names[k] };
}
async function findCover(src, dir){
  const got = await Promise.all(["png","jpg","jpeg","webp"].map(x => src.image(dir + "cover." + x)));
  return got.find(Boolean) || null;
}
async function resolveImages(src, text, dirs){
  const refs = new Set();
  text.split("\n").forEach(l => { const t = imageTag(l); if (t) refs.add(t.src); });
  for (const m of text.matchAll(/!\[[^\]]*\]\(([^)\s]+)/g)) refs.add(m[1]);
  const map = new Map();
  await Promise.all([...refs].map(async r => {
    if (/^(https?:|data:|blob:)/i.test(r)){ map.set(r, await probeImage(r)); return; }
    for (const d of dirs){ const hit = await src.image(d + r); if (hit){ map.set(r, hit); return; } }
    map.set(r, null);
  }));
  return map;
}

/* Numbered chapters: 1 2 3 · 01 02 03 · 001 · a b c · A B C
   each either a file (01.md / 01.txt) or a folder (01/text.md / 01/text.txt) */
const NAMERS = [
  i => String(i), i => String(i).padStart(2,"0"), i => String(i).padStart(3,"0"),
  i => i <= 26 ? String.fromCharCode(96+i) : null, i => i <= 26 ? String.fromCharCode(64+i) : null,
];
const FORMS = n => [n+".md", n+".txt", n+".markdown", n+"/text.md", n+"/text.txt"];
async function tryItem(src, n, pref = -1){
  const forms = FORMS(n);
  if (pref >= 0){
    const t = await src.text(forms[pref]);
    if (t != null) return { path: forms[pref], text: t, form: pref };
  }
  const got = await Promise.all(forms.map((p, k) => k === pref ? null : src.text(p)));
  const k = got.findIndex(t => t != null);
  return k < 0 ? null : { path: forms[k], text: got[k], form: k };
}
async function findChapters(src, expected){
  const firsts = await Promise.all(NAMERS.map(f => tryItem(src, f(1))));
  const k = firsts.findIndex(Boolean);
  if (k < 0) return { scheme: null, list: [] };
  const namer = NAMERS[k], letters = k >= 3, MAX = letters ? 26 : 999;
  const list = [{ ...firsts[k], index: 1, stem: namer(1) }];
  let pref = firsts[k].form, i = 2;
  while (i <= MAX){
    const idx = []; for (let j = i; j < Math.min(i + 6, MAX + 1); j++) idx.push(j);
    const got = await Promise.all(idx.map(j => tryItem(src, namer(j), pref)));
    let stop = false;
    got.forEach((r, n) => {
      if (stop) return;
      const j = idx[n];
      if (r){ list.push({ ...r, index: j, stem: namer(j) }); pref = r.form; }
      else if (j > expected) stop = true;
      else list.push({ missing: true, index: j, stem: namer(j), tried: FORMS(namer(j)).slice(0,2).join(", ") });
    });
    if (stop) break;
    i += 6;
  }
  return { scheme: letters ? "letters" : "numbers", list };
}

/* =====================================================================
   OPENING
   ===================================================================== */
async function openSource(src, opts = {}){
  // One text file on its own is always read as a single story.
  if (src.paths){
    const texts = src.paths().filter(p => /\.(md|markdown|txt|text)$/i.test(p));
    if (texts.length === 1 && !/^(content|title)\.(md|txt)$/i.test(texts[0])){
      return loadSingle(src, { text: await src.text(texts[0]), name: texts[0] });
    }
  }
  const [contents, title, text] = await Promise.all([
    findText(src, ["content.md","content.txt","contents.md","contents.txt"]),
    findText(src, ["title.md","title.txt"]),
    findText(src, opts.file ? [opts.file] : ["text.md","text.txt"]),
  ]);
  if (opts.file && text) return loadSingle(src, text);
  if (contents || title) return loadBook(src, contents, title);
  if (text) return loadSingle(src, text);
  const found = await findChapters(src, 0);
  if (found.list.length) return loadBook(src, null, null, found);
  if (src.paths){
    const loose = src.paths().filter(p => /\.(md|markdown|txt|text)$/i.test(p) && !p.includes("/")).sort();
    if (loose.length) return loadSingle(src, { text: await src.text(loose[0]), name: loose[0] });
  }
  return false;
}

async function loadSingle(src, { text, name }){
  const dir = name.includes("/") ? name.slice(0, name.lastIndexOf("/") + 1) : "";
  const [cover, images] = await Promise.all([findCover(src, ""), resolveImages(src, text, dir ? [dir, ""] : [""])]);
  doc = { kind:"single", text, name, cover, images };
  if (src.kind === "files" || src.kind === "memory") store.set("reader.doc", { text, name });
  return true;
}

async function loadBook(src, contents, titleFile, found){
  const meta = { title:null, subtitle:null, author:null, style:null };
  let names = [];
  if (contents){ const c = parseContents(contents.text); names = c.items; for (const k in meta) if (c.meta[k]) meta[k] = c.meta[k]; }
  if (titleFile){ const t = parseContents(titleFile.text); for (const k in meta) if (t.meta[k]) meta[k] = t.meta[k]; }
  found = found || await findChapters(src, names.length);

  const count = Math.max(names.length, ...found.list.map(c => c.index), 0);
  const chapters = [];
  for (let i = 1; i <= count; i++){
    const f = found.list.find(c => c.index === i) || { missing: true, index: i };
    const n = names[i-1] || {};
    const label = n.label || (found.scheme === "letters" ? String.fromCharCode(64+i) : String(i));
    chapters.push({ index: i, id: "ch-" + i, label, name: n.title || null,
      path: f.path, text: f.text, missing: !!f.missing || f.text == null,
      folder: f.path && f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/") + 1) : "" });
  }
  const [cover] = await Promise.all([
    findCover(src, ""),
    ...chapters.map(async c => {
      if (c.missing) return;
      [c.cover, c.images] = await Promise.all([
        c.folder ? findCover(src, c.folder) : null,
        resolveImages(src, c.text, c.folder ? [c.folder, ""] : [""]),
      ]);
    }),
  ]);
  let notice = null;
  if (!chapters.some(c => !c.missing)){
    notice = src.kind === "files"
      ? "To read the chapters, open the whole folder (folder button), not just this file."
      : "No chapter files were found next to this page. Name them 1.md, 01.md or a.md (or .txt), or put each in a numbered folder as 1/text.md.";
  }
  doc = { kind:"book", meta, cover, chapters, notice, fallbackTitle: src.name };
  store.del("reader.doc");
  return true;
}

/* =====================================================================
   BUILDING WHAT WE SHOW (shared by both layouts)
   ===================================================================== */
function applyImages(frag, map){
  frag.querySelectorAll("figure.pic[data-src]").forEach(fig => {
    const r = map && map.get(fig.dataset.src);
    if (r){
      const img = new Image(); img.src = r.url; img.width = r.w; img.height = r.h; img.alt = fig.dataset.alt || ""; img.decoding = "async";
      fig.prepend(img);
      if (isA5Shape(r)) fig.classList.add("fullpage");
    } else {
      const m = el("p", "missing"); m.textContent = "Image not found: " + fig.dataset.src; fig.replaceWith(m);
    }
  });
  splitBreaks(frag);
  frag.querySelectorAll("img[data-src]").forEach(img => {
    const r = map && map.get(img.dataset.src);
    if (r){ img.src = r.url; img.width = r.w; img.height = r.h; img.removeAttribute("data-src"); } else img.remove();
  });
}
/* Lines ended by a forced break (<br>) become their own paragraphs, so that
   justifying the last line of a paragraph cut by a page never stretches them. */
function splitBreaks(frag){
  [...frag.children].filter(p => p.tagName === "P" && p.querySelector(":scope > br")).forEach(p => {
    const chunks = [[]];
    [...p.childNodes].forEach(n => n.nodeName === "BR" ? chunks.push([]) : chunks[chunks.length - 1].push(n));
    const paras = chunks.filter(c => c.some(n => n.textContent.trim() || n.nodeName === "IMG")).map((c, i) => {
      const q = i === 0 ? p.cloneNode(false) : el("p", "brk");
      c.forEach(n => q.append(n));
      return q;
    });
    p.replaceWith(...paras);
  });
}
/* Images shaped like an A5 page fill the whole page in the A5 layout. */
const A5_RATIO = 148 / 210;
const isA5Shape = img => img && Math.abs(img.w / img.h - A5_RATIO) / A5_RATIO < 0.075;
function markDropcap(frag){ const p = [...frag.children].find(e => e.tagName === "P"); if (p) p.classList.add("dropcap"); }
function addFin(frag){ if (frag.children.length) frag.append(el("p", "fin")); }

function buildModel(){
  if (doc.kind === "single"){
    const p = parseDoc(doc.text, doc.name);
    applyImages(p.frag, doc.images); markDropcap(p.frag); addFin(p.frag);
    return { kind:"single", lang: detectLang(p.text), cover: doc.cover, style: p.style,
             meta: { title:p.title, subtitle:p.subtitle, author:p.author, titleText:p.titleText }, frag: p.frag };
  }
  const lang = detectLang(doc.chapters.map(c => c.text || "").join(" ").slice(0, 8000) + " " + (doc.meta.title || ""));
  const W = words(lang);
  const chapters = doc.chapters.map(c => {
    if (c.missing){
      const title = c.name ? plainHtml(c.name) : esc(W.chapter + " " + c.label);
      return { ...c, title, titleText: textOf(title) };
    }
    const p = parseDoc(c.text, c.path, { forcedTitle: c.name, firstLineTitle: !c.name, fallbackTitle: W.chapter + " " + c.label });
    applyImages(p.frag, c.images); markDropcap(p.frag);
    return { ...c, title: p.title, titleText: p.titleText, subtitle: p.subtitle, author: p.author, frag: p.frag };
  });
  const last = [...chapters].reverse().find(c => !c.missing);
  if (last) addFin(last.frag);
  const title = doc.meta.title ? plainHtml(doc.meta.title) : esc(doc.fallbackTitle || "Untitled");
  return { kind:"book", lang, W, cover: doc.cover, style: doc.meta.style, chapters, notice: doc.notice,
           meta: { title, titleText: textOf(title),
                   subtitle: doc.meta.subtitle ? plainHtml(doc.meta.subtitle) : null,
                   author: doc.meta.author ? plainHtml(doc.meta.author) : null } };
}

/* ---------- Pieces ---------- */
function titleBlock(meta){
  return el("header", "titleblock", `<h1 class="title">${meta.title}</h1>`
    + (meta.subtitle ? `<p class="subtitle">${meta.subtitle}</p>` : "")
    + `<div class="orn" aria-hidden="true"><span></span></div>`
    + (meta.author ? `<p class="author">${meta.author}</p>` : ""));
}
function coverFig(img, cls){
  const f = el("figure", cls); const i = new Image();
  i.src = img.url; i.width = img.w; i.height = img.h; i.alt = ""; f.append(i);
  if (isA5Shape(img)) f.classList.add("fullpage");
  return f;
}
const numHtml = label => (/^\d$/.test(label) ? '<span class="pad">0</span>' : "") + esc(label);
function chapterHead(c){
  return el("header", "chapter-head",
    (c.label ? `<p class="chapter-num">${numHtml(c.label)}</p>` : "")
    + `<h2 class="chapter-title">${c.title}</h2>`
    + (c.subtitle ? `<p class="subtitle">${c.subtitle}</p>` : "")
    + (c.author ? `<p class="author">${c.author}</p>` : ""));
}
function tocHeading(m){ return el("h2", "toc-heading", esc(m.W.contents)); }
function tocItems(m){
  return m.chapters.map(c => {
    const d = el("div", "toc-item" + (c.missing ? " toc-missing" : ""));
    const inner = `<span class="toc-num">${numHtml(c.label)}</span>`
      + `<span class="toc-title">${c.title}${c.missing ? ` <em class="toc-note">(${esc(m.W.missing)})</em>` : ""}</span>`
      + `<span class="toc-dots"></span><span class="toc-page" data-for="${c.id}">${c.missing ? "" : "000"}</span>`;
    d.innerHTML = c.missing
      ? `<span class="toc-row" title="File not found: ${esc(c.tried || "")}">${inner}</span>`
      : `<a class="toc-row" href="#${c.id}">${inner}</a>`;
    return d;
  });
}

/* =====================================================================
   CONTINUOUS LAYOUT
   ===================================================================== */
function renderScroll(m){
  const col = $("#column"); col.lang = m.lang;
  const parts = [];
  if (m.cover) parts.push(coverFig(m.cover, "cover"));
  parts.push(titleBlock(m.meta));
  if (m.kind === "single") parts.push(m.frag);
  else {
    const nav = el("nav", "toc"); nav.id = "toc"; nav.append(tocHeading(m), ...tocItems(m));
    if (m.notice) nav.append(el("p", "notice", esc(m.notice)));
    parts.push(nav);
    m.chapters.filter(c => !c.missing).forEach(c => {
      const sec = el("section", "chapter"); sec.id = c.id;
      if (c.cover) sec.append(coverFig(c.cover, "chapter-cover"));
      sec.append(chapterHead(c), c.frag);
      parts.push(sec);
    });
  }
  col.replaceChildren(...parts);
}

/* =====================================================================
   A5 LAYOUT
   ===================================================================== */
const SPLITTABLE = /^(P|BLOCKQUOTE|UL|OL|PRE)$/;
const keepWithNext = e => /^H[1-6]$/.test(e.tagName) || e.classList.contains("chapter-head") || e.classList.contains("toc-heading");

function breakpoints(e){
  const pts = []; const isPre = e.tagName === "PRE";
  const w = document.createTreeWalker(e, NodeFilter.SHOW_TEXT); let t;
  while ((t = w.nextNode())){
    const re = isPre ? /\n/g : /\s+/g; let m;
    while ((m = re.exec(t.nodeValue))) pts.push({ node:t, offset:m.index + m[0].length });
  }
  return pts;
}

function splitBlock(e, body, fits, minLines){
  const pts = breakpoints(e);
  if (!pts.length) return null;
  const head = i => { const r = document.createRange(); r.setStart(e,0); r.setEnd(pts[i].node, pts[i].offset);
    const c = e.cloneNode(false); c.appendChild(r.cloneContents()); return c; };
  let lo = 0, hi = pts.length-1, best = -1;
  while (lo <= hi){
    const mid = (lo+hi) >> 1; const c = head(mid);
    body.appendChild(c); const ok = fits(); body.removeChild(c);
    if (ok){ best = mid; lo = mid+1; } else hi = mid-1;
  }
  if (best < 0) return null;
  const a = head(best);
  if (minLines && e.tagName === "P"){        // no lonely first line at the foot of a page
    body.appendChild(a);
    const lines = a.offsetHeight / (parseFloat(getComputedStyle(a).lineHeight) || 1e9);
    body.removeChild(a);
    if (lines < 1.6) return null;
  }
  const r = document.createRange(); r.setStart(pts[best].node, pts[best].offset); r.setEnd(e, e.childNodes.length);
  const b = e.cloneNode(false); b.appendChild(r.cloneContents());
  a.classList.add("split");
  b.classList.remove("dropcap","split"); b.classList.add("cont");
  if (e.tagName === "OL" || e.tagName === "UL"){
    const li = pts[best].node.parentElement.closest("li");
    let mid = false;
    if (li && e.contains(li)){ const r2 = document.createRange(); r2.setStart(li,0); r2.setEnd(pts[best].node, pts[best].offset); mid = r2.toString().trim() !== ""; }
    const firstLi = b.querySelector(":scope > li");
    if (mid && firstLi) firstLi.classList.add("cont-li");
    if (e.tagName === "OL"){
      const n = a.querySelectorAll(":scope > li").length;
      b.setAttribute("start", (parseInt(e.getAttribute("start")||"1",10)) + n - (mid ? 1 : 0));
    }
  }
  [a,b].forEach(x => x.querySelectorAll("li:empty").forEach(z => z.remove()));
  return [a, b];
}

function makePager(host, lang){
  const pages = [];
  function newPage(cls, data){
    const slot = el("div", "slot");
    const page = el("article", "page " + (pages.length % 2 === 0 ? "recto " : "verso ") + (cls || ""));
    page.innerHTML = '<div class="page-head"></div><div class="page-body prose"></div><div class="page-num"></div>';
    Object.assign(page.dataset, data || {});
    const body = page.querySelector(".page-body"); body.lang = lang;
    slot.append(page); host.append(slot); pages.push(page);
    return body;
  }
  // Pours nodes into pages, starting on a fresh page. Returns that first page.
  // Full-page images ("plates") wait until the current page is full, then take a page of their own.
  function flow(nodes, cls, data){
    let body = newPage(cls, { ...data, first: "1" });
    const firstPage = pages[pages.length - 1];
    const fits = () => body.scrollHeight <= body.clientHeight + 1;
    const pending = [];
    const plate = fig => { newPage(cls + " plate", data).append(fig); };
    const next = () => { while (pending.length) plate(pending.shift()); return newPage(cls, data); };
    const queue = [...nodes];
    let guard = 0;
    while (queue.length && guard++ < 50000){
      const e = queue.shift();
      if (e.classList.contains("fullpage")){
        if (!body.firstChild){ body.parentElement.classList.add("plate"); body.append(e); body = newPage(cls, data); }
        else pending.push(e);
        continue;
      }
      body.appendChild(e);
      if (fits()) continue;
      body.removeChild(e);
      const empty = !body.firstChild;
      if (SPLITTABLE.test(e.tagName)){
        const parts = splitBlock(e, body, fits, !empty);
        if (parts){ body.appendChild(parts[0]); queue.unshift(parts[1]); body = next(); continue; }
      }
      if (empty){ body.appendChild(e); body = next(); continue; }   // too big for any page: let it clip
      const carry = [e];
      while (body.children.length > 1 && keepWithNext(body.lastElementChild)){
        carry.unshift(body.lastElementChild); body.removeChild(body.lastElementChild);
      }
      body = next();
      queue.unshift(...carry);
    }
    if (!body.firstChild && pages[pages.length - 1] !== firstPage){ pages.pop().closest(".slot").remove(); }
    while (pending.length) plate(pending.shift());
    return firstPage;
  }
  return { pages, newPage, flow };
}

function renderPages(m){
  const host = $("#pages"); host.innerHTML = "";
  scaleToFit();
  const P = makePager(host, m.lang);
  const padToRecto = () => { if (P.pages.length % 2) P.newPage("front blank"); };   // page 1 always on a right-hand page

  if (m.cover){ P.newPage("front cover-page" + (isA5Shape(m.cover) ? " plate" : "")).append(coverFig(m.cover, "cover")); }
  if (m.kind === "single"){
    padToRecto();
    P.flow([titleBlock(m.meta), ...m.frag.children], "body", { chapter: m.meta.titleText });
  } else {
    P.newPage("front title-page").append(titleBlock(m.meta));
    const toc = [tocHeading(m), ...tocItems(m)];
    if (m.notice) toc.push(el("p", "notice", esc(m.notice)));
    P.flow(toc, "front contents-page").closest(".slot").id = "toc";
    padToRecto();
    m.chapters.filter(c => !c.missing).forEach(c => {
      const nodes = [];
      if (c.cover) nodes.push(coverFig(c.cover, "chapter-cover"));
      nodes.push(chapterHead(c), ...c.frag.children);
      P.flow(nodes, "body", { chapter: c.titleText }).closest(".slot").id = c.id;
    });
  }
  // Folios and running heads: numbering starts on the first page of the text.
  let n = 0;
  P.pages.forEach((pg, i) => {
    if (!pg.classList.contains("body")) return;
    pg.dataset.n = ++n;
    pg.querySelector(".page-num").textContent = n;
    if (pg.dataset.first || pg.classList.contains("plate") || pg.querySelector(".chapter-head,.titleblock")) return;
    pg.querySelector(".page-head").textContent =
      m.kind === "single" ? m.meta.titleText : (i % 2 ? m.meta.titleText : pg.dataset.chapter);
  });
  host.querySelectorAll(".toc-page[data-for]").forEach(s => {
    const slot = document.getElementById(s.dataset.for);
    s.textContent = slot ? slot.querySelector(".page").dataset.n : "";
  });
}

/* =====================================================================
   RENDER
   ===================================================================== */
const fontJobs = {};
function loadStyle(name){
  const s = STYLES[name];
  if (!fontJobs[name]) fontJobs[name] = (async () => {
    if (s.fonts){
      const l = document.createElement("link"); l.rel = "stylesheet"; l.href = s.fonts;
      const done = new Promise(r => { l.onload = r; l.onerror = r; setTimeout(r, 3000); });
      document.head.append(l); await done;
    }
    if (document.fonts && s.preload)
      await Promise.race([Promise.all(s.preload.map(f => document.fonts.load(f).catch(() => {}))), sleep(2500)]);
  })();
  return fontJobs[name];
}
const styleKey = s => { s = String(s || "").trim().toLowerCase(); s = STYLE_ALIASES[s] || s; return STYLES[s] ? s : null; };
const pickStyle = docStyle => styleKey(st.style) || styleKey(docStyle) || DEFAULT_STYLE;

function scaleToFit(){
  const pageW = 148 * 96 / 25.4;
  root.style.setProperty("--s", Math.min(1, (window.innerWidth - 24) / pageW).toFixed(4));
}

let renderSeq = 0;
async function render(keepPlace){
  const seq = ++renderSeq;
  const se = document.scrollingElement;
  const ratio = keepPlace ? se.scrollTop / Math.max(1, se.scrollHeight - innerHeight) : 0;
  root.style.setProperty("--fs", SIZES_PX[st.size] + "px");
  root.style.setProperty("--fsA5", SIZES_PT[st.size] + "pt");
  $("#sizeLabel").textContent = st.mode === "a5" ? SIZES_PT[st.size] + "pt" : SIZES_PX[st.size] + "px";
  $("#modeScroll").setAttribute("aria-pressed", st.mode === "scroll");
  $("#modeA5").setAttribute("aria-pressed", st.mode === "a5");
  $("#styleBtn").hidden = Object.keys(STYLES).length < 2;
  document.body.classList.toggle("a5", st.mode === "a5");
  $("#loading").hidden = true;

  if (!doc){
    root.dataset.style = pickStyle(null); loadStyle(root.dataset.style);
    $("#welcome").hidden = false; $("#bar").hidden = true; $("#column").hidden = true; $("#pages").hidden = true;
    document.title = "TXTworm"; return;
  }
  $("#welcome").hidden = true; $("#bar").hidden = false;
  const m = buildModel();
  $("#tocBtn").hidden = m.kind !== "book";
  root.dataset.style = pickStyle(m.style);
  $("#styleBtn").title = "Style: " + STYLES[root.dataset.style].label + " (S)";
  document.title = m.meta.titleText;
  await loadStyle(root.dataset.style);
  if (seq !== renderSeq) return;

  if (st.mode === "scroll"){
    $("#pages").hidden = true; $("#pages").innerHTML = "";
    $("#column").hidden = false; renderScroll(m);
  } else {
    $("#column").hidden = true; $("#column").innerHTML = "";
    $("#pages").hidden = false; renderPages(m);
  }
  if (keepPlace) se.scrollTop = ratio * (se.scrollHeight - innerHeight);
  else if (location.hash && document.getElementById(location.hash.slice(1))){
    document.getElementById(location.hash.slice(1)).scrollIntoView({ behavior:"instant" });
  } else se.scrollTop = 0;
}

/* =====================================================================
   OPENING FILES BY HAND
   ===================================================================== */
async function openEntries(entries, name){
  if (!entries.length) return;
  if (source && source.close) source.close();
  const src = fileSource(entries, name);
  $("#loading").hidden = false;
  history.replaceState(null, "", location.pathname + location.search);
  const ok = await openSource(src);
  if (ok){ source = src; render(false); }
  else { $("#loading").hidden = true; showMsg("No .txt or .md files were found there."); }
}
function showMsg(t){ const m = $("#welcomeMsg"); m.textContent = t; m.hidden = !t; if (!doc) render(false); }

function entriesFromInput(files){
  const list = [...files];
  const rel = list.map(f => f.webkitRelativePath || f.name);
  const tops = new Set(rel.map(p => p.split("/")[0]));
  const strip = tops.size === 1 && rel.every(p => p.includes("/"));
  return { name: strip ? [...tops][0] : "", entries: list.map((f, i) => ({ path: strip ? rel[i].slice(rel[i].indexOf("/") + 1) : rel[i], file: f })) };
}
async function walk(dir, prefix, out, depth){
  if (depth > 3) return;
  const reader = dir.createReader(); let batch;
  do {
    batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    for (const e of batch){
      if (e.isDirectory) await walk(e, prefix + e.name + "/", out, depth + 1);
      else out.push({ path: prefix + e.name, file: await new Promise((res, rej) => e.file(res, rej)) });
    }
  } while (batch.length);
}
async function entriesFromDrop(dt){
  const items = [...(dt.items || [])].filter(i => i.kind === "file");
  const ents = items.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);   // must be read before any await
  if (!ents.length) return { name:"", entries: [...dt.files].map(f => ({ path: f.name, file: f })) };
  const out = [];
  if (ents.length === 1 && ents[0].isDirectory){ await walk(ents[0], "", out, 0); return { name: ents[0].name, entries: out }; }
  for (const e of ents){
    if (e.isDirectory) await walk(e, e.name + "/", out, 1);
    else out.push({ path: e.name, file: await new Promise((res, rej) => e.file(res, rej)) });
  }
  return { name:"", entries: out };
}

/* ---------- Theme ---------- */
const mq = matchMedia("(prefers-color-scheme: dark)");
const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
function applyTheme(){
  const t = st.theme || (mq.matches ? "dark" : "light");
  root.dataset.theme = t;
  $("#themeBtn").innerHTML = t === "dark" ? ICON_SUN : ICON_MOON;
}
mq.addEventListener?.("change", applyTheme);

/* ---------- Controls ---------- */
const openPicker = () => $("#file").click();
const openFolder = () => $("#folder").click();
const setMode = m => { if (st.mode === m) return; st.mode = m; saveSettings(); render(false); };
const resize = d => { const n = Math.max(0, Math.min(SIZES_PX.length-1, st.size + d)); if (n === st.size) return; st.size = n; saveSettings(); render(true); };
const toggleTheme = () => { st.theme = root.dataset.theme === "dark" ? "light" : "dark"; saveSettings(); applyTheme(); };
const setStyle = k => { $("#styleMenu").hidden = true; if (k === root.dataset.style) return; st.style = k; saveSettings(); render(true); };
const nextStyle = () => {
  const keys = Object.keys(STYLES); if (keys.length < 2) return;
  setStyle(keys[(keys.indexOf(root.dataset.style) + 1) % keys.length]);
};
const toggleStyleMenu = () => {
  const m = $("#styleMenu");
  if (!m.hidden){ m.hidden = true; return; }
  m.replaceChildren(...Object.entries(STYLES).map(([k, s]) => {
    const b = el("button"); b.textContent = s.label; b.setAttribute("role", "menuitemradio");
    b.setAttribute("aria-pressed", k === root.dataset.style); b.onclick = () => setStyle(k); return b;
  }));
  m.hidden = false;
};
document.addEventListener("click", e => { if (!e.target.closest("#styleMenu,#styleBtn")) $("#styleMenu").hidden = true; });
const goToc = () => { const t = document.getElementById("toc"); if (t) t.scrollIntoView({ behavior:"smooth" }); };

$("#openBtn").onclick = openPicker;
$("#folderBtn").onclick = openFolder;
$("#welcomeOpen").onclick = openPicker;
$("#welcomeFolder").onclick = openFolder;
$("#file").onchange = e => { const r = entriesFromInput(e.target.files); openEntries(r.entries, r.name); e.target.value = ""; };
$("#folder").onchange = e => { const r = entriesFromInput(e.target.files); openEntries(r.entries, r.name); e.target.value = ""; };
$("#modeScroll").onclick = () => setMode("scroll");
$("#modeA5").onclick = () => setMode("a5");
$("#smaller").onclick = () => resize(-1);
$("#bigger").onclick = () => resize(1);
$("#themeBtn").onclick = toggleTheme;
$("#styleBtn").onclick = toggleStyleMenu;
$("#tocBtn").onclick = goToc;
$("#printBtn").onclick = () => window.print();
$("#sampleBtn").onclick = async () => { source = memorySource(); await loadSingle(source, { text: SAMPLE, name: "sample.md" }); render(false); };

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "+" || k === "=") resize(1);
  else if (k === "-" || k === "_") resize(-1);
  else if (k === "d") toggleTheme();
  else if (k === "p") setMode(st.mode === "a5" ? "scroll" : "a5");
  else if (k === "o") openPicker();
  else if (k === "c" && doc && doc.kind === "book") goToc();
  else if (k === "s") nextStyle();
});

let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("drop"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("drop"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("drop");
  const r = await entriesFromDrop(e.dataTransfer); openEntries(r.entries, r.name);
});

let lastY = 0;
addEventListener("scroll", () => {
  const y = scrollY; const bar = $("#bar");
  if (y > lastY + 6 && y > 120) bar.classList.add("hidden");
  else if (y < lastY - 6 || y < 120) bar.classList.remove("hidden");
  lastY = y;
}, { passive:true });
addEventListener("mousemove", e => { if (e.clientY < 70) $("#bar").classList.remove("hidden"); });
addEventListener("resize", () => { if (st.mode === "a5") scaleToFit(); });

/* ---------- Sample ---------- */
const SAMPLE = `---
title: The Lamplighter's Ledger
subtitle: A short story
author: Anonymous
---

Every evening at a quarter past six, Tomás climbed the iron ladder outside the municipal library and lit the lamp that nobody needed any more. The streetlights had been electric for forty years. The council had voted twice to remove the old fixture, and twice the vote had been lost in a drawer somewhere, which is how most things in that town were decided.

He kept a ledger. In it he wrote the date, the time of lighting, the weather, and one sentence about something he had seen from the top of the ladder. "Rain. A boy carrying a cello as if it were asleep." "Clear. The baker's daughter laughing at nothing." "Wind from the south. Somebody has painted the post office door green, and it is wrong, and I love it."

The ledger had grown to eleven volumes. He stored them on the lowest shelf of the reading room, between a broken atlas and a dictionary of birds, because the librarian had said that anything placed on a shelf long enough becomes a book, and anything that becomes a book belongs to everyone.

## The visitor

In October a woman arrived from the capital with a clipboard and a coat too thin for the season. She had been sent to make an inventory of *obsolete public assets*, and the lamp was on her list. She watched him climb, light the wick, and climb down again.

"It doesn't illuminate anything," she said.

"No," he agreed. "It's not that kind of lamp."

She wrote something on her clipboard. Then, because she was cold and the library was warm, she went inside and sat in the reading room until closing time. The next evening she came back. On the third evening Tomás found her on the lowest shelf's side of the room, the seventh volume of his ledger open on her knees, reading by the light of the window—which is to say, by the light of his lamp.

---

Her report, when it was finally filed, described the fixture as *a functioning historical installation of moderate cultural value*. It recommended that it be preserved, and that its keeper be paid, retroactively, for forty years of service.

The council lost that recommendation in a drawer as well. But on the first page of the twelfth volume there is an entry in a different hand: "Cold. A man on a ladder, lighting the only lamp in town that shows you where you are."
`;

applyTheme();

  if (ok) source = src;
  else {

  }
  render(false);
})();
})();
