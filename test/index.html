<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ---------- Theme ---------- */
:root{
  --bg:#f3f0e8; --paper:#fffdf8; --ink:#1f1c18; --muted:#7c7468; --rule:#ddd5c6;
  --accent:#8a2e1e; --chrome:rgba(255,253,248,.88);
  --shadow:0 1px 2px rgba(40,30,10,.06),0 10px 34px rgba(60,40,10,.12);
  --body:"EB Garamond",Garamond,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --display:"Cormorant Garamond","EB Garamond",Garamond,Georgia,serif;
  --fs:20px; --fsA5:11pt; --s:1;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121110; --paper:#1c1a17; --ink:#e7e0d2; --muted:#9b9285; --rule:#3a352e;
  --accent:#d9906f; --chrome:rgba(28,26,23,.88);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  transition:background .3s,color .3s;min-height:100vh}
body.a5{background:var(--bg)}

/* ---------- Toolbar ---------- */
.bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
  background:var(--chrome);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--rule);box-shadow:0 4px 18px rgba(0,0,0,.08);
  font-family:var(--body);transition:transform .35s ease,opacity .35s ease;white-space:nowrap}
.bar.hidden{transform:translate(-50%,-160%);opacity:0}
.bar button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;
  height:32px;min-width:32px;padding:0 11px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.02em}
.bar button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.bar .sep{width:1px;height:18px;background:var(--rule);margin:0 4px}
.bar .seg{display:flex;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:999px}
.bar .size{font-variant-numeric:lining-nums;font-size:13px;color:var(--muted);min-width:34px;text-align:center}
.bar svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bar .sc{font-variant:small-caps;letter-spacing:.06em}
@media (max-width:520px){ .bar .hide-sm{display:none} .bar button{padding:0 8px} }

/* ---------- Prose ---------- */
.prose{line-height:1.55;text-align:justify;hyphens:auto;-webkit-hyphens:auto;
  font-kerning:normal;font-feature-settings:"kern","liga","onum";
  overflow-wrap:break-word;text-rendering:optimizeLegibility}
.prose p{margin:0;text-indent:1.5em}
.prose > p:first-child,.prose :is(h1,h2,h3,h4,h5,h6,hr,blockquote,ul,ol,pre,.titleblock,figure) + p,
.prose p.dropcap,.prose p.cont{text-indent:0}
.prose p.split{text-align-last:justify}
.prose p.dropcap{display:flow-root}
.prose p.dropcap::first-letter{float:left;font-family:var(--display);font-weight:500;
  font-size:4.15em;line-height:.78;margin:.07em .07em -.05em 0;padding-top:.02em;color:var(--accent)}
.prose p.dropcap::first-line{font-variant-caps:small-caps;letter-spacing:.04em}
.prose :is(h1,h2){font-family:var(--display);font-weight:500;font-size:1.55em;line-height:1.15;
  text-align:center;margin:1.6em 0 .8em;hyphens:none;text-wrap:balance}
.prose h3{font-weight:400;font-style:italic;font-size:1.15em;text-align:center;margin:1.4em 0 .6em;hyphens:none}
.prose :is(h4,h5,h6){font-weight:500;font-size:1em;font-variant:small-caps;letter-spacing:.06em;margin:1.2em 0 .4em;text-align:left}
.prose blockquote{margin:1em 1.6em;font-style:italic}
.prose blockquote p{text-indent:0}
.prose blockquote p + p{margin-top:.5em}
.prose :is(ul,ol){margin:.7em 0;padding-left:1.6em;text-align:left}
.prose li{margin:.15em 0}
.prose li.cont-li{list-style:none}
.prose hr{border:0;margin:1.1em 0;height:1.5em;text-align:center;overflow:visible}
.prose hr::before{content:"⁂";color:var(--muted);font-size:1.05em;line-height:1.5em}
.prose pre{font-size:.8em;line-height:1.45;white-space:pre-wrap;text-align:left;hyphens:none;
  background:color-mix(in srgb,var(--ink) 5%,transparent);padding:.8em 1em;border-radius:4px;margin:1em 0}
.prose code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.85em}
.prose pre code{font-size:1em}
.prose a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:.15em}
.prose img{display:block;max-width:100%;max-height:70vh;margin:1em auto;border-radius:2px}
.prose strong{font-weight:600}
.prose .fin{text-align:center;color:var(--accent);margin-top:1.4em;font-size:1.1em;text-indent:0}

/* ---------- Title block ---------- */
.titleblock{text-align:center;margin:0 0 2.4em;hyphens:none}
.titleblock .title{font-family:var(--display);font-weight:500;font-size:2.7em;line-height:1.04;
  letter-spacing:.005em;margin:0;text-wrap:balance}
.titleblock .subtitle{font-family:var(--display);font-style:italic;font-size:1.3em;line-height:1.25;
  color:var(--muted);margin:.45em 0 0;text-indent:0;text-align:center;text-wrap:balance}
.titleblock .orn{display:flex;align-items:center;justify-content:center;gap:.7em;
  color:var(--accent);width:min(11em,60%);margin:1.1em auto 0}
.titleblock .orn::before,.titleblock .orn::after{content:"";flex:1;height:1px;background:currentColor;opacity:.45}
.titleblock .orn span{font-size:.55em;line-height:1}
.titleblock .author{font-variant:small-caps;letter-spacing:.14em;font-size:.95em;color:var(--muted);
  margin:1em 0 0;text-indent:0;text-align:center}

/* ---------- Continuous ---------- */
#column{font-size:var(--fs);max-width:33em;margin:0 auto;padding:7.5rem 1.4rem 7rem}
#column .titleblock{margin:1.5em 0 2.6em}
#column .titleblock .title{font-size:3em}

/* ---------- A5 pages ---------- */
#pages{padding:84px 0 60px}
.slot{width:calc(148mm * var(--s));height:calc(210mm * var(--s));margin:0 auto 26px;position:relative}
.page{position:absolute;top:0;left:0;width:148mm;height:210mm;background:var(--paper);
  box-shadow:var(--shadow);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;
  transition:background .3s}
.page-body{position:absolute;top:19mm;bottom:19mm;left:17mm;right:15mm;overflow:hidden;font-size:var(--fsA5)}
.page.verso .page-body{left:15mm;right:17mm}
.page-head,.page-num{position:absolute;left:0;right:0;text-align:center;color:var(--muted);
  font-size:calc(var(--fsA5) * .78);letter-spacing:.12em;font-variant:small-caps;
  font-feature-settings:"onum"}
.page-head{top:9.5mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 22mm}
.page-num{bottom:9mm;letter-spacing:.04em;font-size:calc(var(--fsA5) * .85)}
.page.first .titleblock{margin-top:16mm;margin-bottom:9mm}

/* ---------- Welcome & drop ---------- */
#welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;gap:.2rem}
#welcome h1{font-family:var(--display);font-weight:500;font-size:clamp(2.6rem,7vw,4.4rem);margin:0;line-height:1}
#welcome p{color:var(--muted);font-size:1.2rem;font-style:italic;margin:.6rem 0 1.6rem}
#welcome .actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
#welcome button{font:inherit;font-size:1.05rem;padding:.55em 1.3em;border-radius:999px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
#welcome button.ghost{background:none;color:var(--ink);border-color:var(--rule)}
#welcome small{display:block;margin-top:2rem;color:var(--muted);font-size:.95rem;letter-spacing:.02em}
.drop::after{content:"Drop to read";position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2.2rem;
  color:var(--accent);background:color-mix(in srgb,var(--paper) 85%,transparent);z-index:20}
[hidden]{display:none!important}

/* ---------- Print ---------- */
@media print{
  :root,:root[data-theme=dark]{--bg:#fff;--paper:#fff;--ink:#000;--muted:#555;--rule:#ccc;--accent:#7a2a1c;--s:1!important}
  .bar{display:none}
  body,body.a5{background:#fff}
  #pages{padding:0}
  .slot{margin:0;break-after:page;page-break-after:always}
  .slot:last-child{break-after:auto}
  .page{box-shadow:none;transform:none}
  #column{padding:0}
}
@page{size:A5;margin:0}
</style>
</head>
<body>

<nav class="bar" id="bar" hidden>
  <button id="openBtn" title="Open a .md or .txt file (O)">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2h6.5A1.5 1.5 0 0 1 20 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/></svg>
    <span class="hide-sm">Open</span>
  </button>
  <span class="sep"></span>
  <div class="seg" role="group" aria-label="Layout">
    <button id="modeScroll" title="Continuous text (P)"><span class="sc">scroll</span></button>
    <button id="modeA5" title="A5 pages (P)">A5</button>
  </div>
  <span class="sep"></span>
  <button id="smaller" title="Smaller text (−)" aria-label="Smaller text">−</button>
  <span class="size" id="sizeLabel"></span>
  <button id="bigger" title="Larger text (+)" aria-label="Larger text">+</button>
  <span class="sep"></span>
  <button id="themeBtn" title="Light / dark (D)" aria-label="Toggle dark mode"></button>
  <button id="printBtn" class="hide-sm" title="Print / save as PDF" aria-label="Print">
    <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M7 14h10v6H7z"/></svg>
  </button>
</nav>

<section id="welcome" hidden>
  <h1>Open a story</h1>
  <p>Drop a .md or .txt file anywhere on this page.</p>
  <div class="actions">
    <button id="welcomeOpen">Choose a file</button>
    <button id="sampleBtn" class="ghost">Read a sample</button>
  </div>
  <small>Tip: put <code>text.md</code> next to this page on your site and it opens by itself.</small>
</section>

<main id="column" class="prose" hidden></main>
<main id="pages" hidden></main>

<input type="file" id="file" accept=".md,.markdown,.txt,.text,text/markdown,text/plain" hidden>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const root = document.documentElement;
const SIZES_PX = [15,16,17,18,19,20,21,22,24,26,28,30];
const SIZES_PT = [8.5,9,9.5,10,10.5,11,11.5,12,13,14,15,16];
const DEFAULT_SIZE = 5;

/* ---------- Persistence (best effort) ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const st = Object.assign({ mode:"scroll", size:DEFAULT_SIZE, theme:null }, store.get("reader.settings") || {});
st.size = Math.max(0, Math.min(SIZES_PX.length-1, st.size|0));
let doc = null; // {text, name}
const saveSettings = () => store.set("reader.settings", st);

/* ---------- Helpers ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const prettyName = n => (n||"").replace(/\.[^.]+$/,"").replace(/[-_]+/g," ").replace(/\s+/g," ").trim()
  .replace(/^./, c => c.toUpperCase());

/* ---------- Markdown (small, dependency-free) ---------- */
function inline(s){
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_,c) => { codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;.*?&quot;)?\)/g, '<img alt="$1" src="$2">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;.*?&quot;)?\)/g, '<a href="$2">$1</a>');
  s = s.replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>");
  s = s.replace(/\*(?=\S)([\s\S]*?\S)\*/g, "<em>$1</em>");
  s = s.replace(/(^|[^\w])_(?=\S)([\s\S]*?\S)_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
  s = s.replace(/\u0000(\d+)\u0000/g, (_,n) => "<code>"+esc(codes[n])+"</code>");
  return s;
}
const HR = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const LIST = /^\s*([-*+]|\d+[.)])\s+(.*)$/;
const isBlockStart = l => /^(#{1,6}\s|```|~~~|\s*>)/.test(l) || HR.test(l) || LIST.test(l);

function mdToHtml(src){
  const lines = src.split("\n"); const out = []; let i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (!line.trim()){ i++; continue; }
    let m;
    if ((m = line.match(/^(```|~~~)/))){
      const fence = m[1], buf = []; i++;
      while (i < lines.length && !lines[i].startsWith(fence)) buf.push(lines[i++]);
      i++; out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){
      const n = m[1].length; out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue;
    }
    if (HR.test(line)){ out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)){
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*> ?/,""));
      out.push("<blockquote>"+mdToHtml(buf.join("\n"))+"</blockquote>"); continue;
    }
    if ((m = line.match(LIST))){
      const ordered = /\d/.test(m[1]); const start = ordered ? parseInt(m[1],10) : 1; const items = [];
      while (i < lines.length){
        const mm = lines[i].match(LIST);
        if (mm && /\d/.test(mm[1]) === ordered){ items.push(mm[2]); i++; }
        else if (items.length && lines[i].trim() && /^\s+/.test(lines[i]) && !mm){ items[items.length-1] += " "+lines[i].trim(); i++; }
        else break;
      }
      const lis = items.map(t => "<li>"+inline(t)+"</li>").join("");
      out.push(ordered ? `<ol${start!==1?` start="${start}"`:""}>${lis}</ol>` : `<ul>${lis}</ul>`);
      continue;
    }
    const buf = []; let heading = 0;
    while (i < lines.length && lines[i].trim()){
      if (buf.length && /^=+\s*$/.test(lines[i])){ heading = 1; i++; break; }
      if (buf.length && /^-+\s*$/.test(lines[i])){ heading = 2; i++; break; }
      if (buf.length && isBlockStart(lines[i])) break;
      buf.push(lines[i++]);
    }
    if (heading){ out.push(`<h${heading}>${inline(buf.join(" "))}</h${heading}>`); continue; }
    const html = inline(buf.join("\n")).replace(/( {2,}|\\)\n/g,"<br>").replace(/\n/g," ");
    out.push("<p>"+html+"</p>");
  }
  return out.join("\n");
}

function txtToHtml(src){
  const lines = src.split("\n").map(l => l.trim()).filter(Boolean);
  // Hard-wrapped text (e.g. Project Gutenberg): fixed-width lines, paragraphs separated by blank lines.
  const hasBlankLines = /\n\s*\n/.test(src.trim());
  const lens = lines.map(l => l.length);
  const maxLen = Math.max(0, ...lens);
  const wrappedShare = lens.filter(n => n >= 50 && n <= 82).length / Math.max(1, lens.length);
  const hardWrapped = hasBlankLines && maxLen <= 85 && wrappedShare > 0.5;

  const blocks = hardWrapped
    ? src.split(/\n\s*\n/).map(b => b.trim().replace(/\s*\n\s*/g," ")).filter(Boolean)
    : lines; // otherwise every line is its own paragraph
  return blocks.map(b =>
    /^(\*\s*){3,}$|^(-\s*){3,}$|^#$/.test(b) ? "<hr>" : "<p>"+esc(b)+"</p>"
  ).join("\n");
}

/* ---------- Typography polish ---------- */
function smarten(node){
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement?.closest("pre,code") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  let t;
  while ((t = w.nextNode())){
    t.nodeValue = t.nodeValue
      .replace(/\.\.\./g,"…").replace(/---/g,"—").replace(/--/g,"—").replace(/ - /g," – ")
      .replace(/(^|[\s(\[{—–\-])"/g,"$1“").replace(/"/g,"”")
      .replace(/(^|[\s(\[{—–\-])'/g,"$1‘").replace(/'/g,"’");
  }
}
function detectLang(text){
  const sample = " "+text.slice(0,6000).toLowerCase()+" ";
  const count = re => (sample.match(re)||[]).length;
  const es = count(/\s(el|la|los|las|que|de|y|en|un|una|por|con|para|es|se|no|del|lo)\s/g);
  const en = count(/\s(the|and|of|to|is|that|in|it|you|was|he|she|for|with|on)\s/g);
  return es > en ? "es" : "en";
}

/* ---------- Parse a document ---------- */
function parse(text, name){
  text = text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const meta = {};
  const fm = text.match(/^---\n([\s\S]*?)\n---\n?/);
  if (fm){
    fm[1].split("\n").forEach(l => { const m = l.match(/^(\w+)\s*:\s*(.*)$/); if (m) meta[m[1].toLowerCase()] = m[2].replace(/^["']|["']$/g,""); });
    text = text.slice(fm[0].length);
  }
  const isTxt = /\.te?xt$/i.test(name||"");
  const tpl = document.createElement("template");
  tpl.innerHTML = isTxt ? txtToHtml(text) : mdToHtml(text);
  const frag = tpl.content;
  smarten(frag);

  const smartStr = s => { if (!s) return null; const d = document.createElement("div"); d.textContent = s; smarten(d); return esc(d.textContent); };
  let title = smartStr(meta.title);
  let subtitle = smartStr(meta.subtitle);
  let author = smartStr(meta.author);
  const first = () => frag.firstElementChild;

  if (!title && first()){
    if (first().tagName === "H1"){ title = first().innerHTML; first().remove(); }
    else if (isTxt && first().tagName === "P"){
      const t = first().textContent.trim();
      if (t.length <= 90 && !/[.!?…:;,]$/.test(t) && frag.children.length > 1){ title = first().innerHTML; first().remove(); }
    }
  }
  if (title && !subtitle && first() && first().tagName === "P" && first().childNodes.length === 1 &&
      first().firstChild.nodeName === "EM"){ subtitle = first().firstChild.innerHTML; first().remove(); }
  if (title && !author && first() && first().tagName === "P" && /^(by|por)\s+\S/i.test(first().textContent.trim()) &&
      first().textContent.length < 80){ author = first().innerHTML.replace(/^\s*(by|por)\s+/i,""); first().remove(); }
  if (!title) title = esc(prettyName(name) || "Untitled");

  const firstP = [...frag.children].find(el => el.tagName === "P");
  if (firstP) firstP.classList.add("dropcap");
  if (frag.children.length){
    const fin = document.createElement("p"); fin.className = "fin"; fin.textContent = "❦"; frag.appendChild(fin);
  }
  const tmp = document.createElement("div"); tmp.innerHTML = title;
  return { title, subtitle, author, titleText: tmp.textContent.trim(), lang: detectLang(text), frag };
}

function titleBlock(p){
  const d = document.createElement("header"); d.className = "titleblock";
  d.innerHTML = `<h1 class="title">${p.title}</h1>`
    + (p.subtitle ? `<p class="subtitle">${p.subtitle}</p>` : "")
    + `<div class="orn" aria-hidden="true"><span>◆</span></div>`
    + (p.author ? `<p class="author">${p.author}</p>` : "");
  return d;
}

/* ---------- Pagination ---------- */
const SPLITTABLE = /^(P|BLOCKQUOTE|UL|OL|PRE)$/;

function breakpoints(el){
  const pts = []; const isPre = el.tagName === "PRE";
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let t;
  while ((t = w.nextNode())){
    const re = isPre ? /\n/g : /\s+/g; let m;
    while ((m = re.exec(t.nodeValue))){
      pts.push({ node:t, offset:m.index + m[0].length });
    }
  }
  return pts;
}

function splitBlock(el, body, fits, minLines){
  const pts = breakpoints(el);
  if (!pts.length) return null;
  const head = i => { const r = document.createRange(); r.setStart(el,0); r.setEnd(pts[i].node, pts[i].offset);
    const c = el.cloneNode(false); c.appendChild(r.cloneContents()); return c; };
  let lo = 0, hi = pts.length-1, best = -1;
  while (lo <= hi){
    const mid = (lo+hi) >> 1; const c = head(mid);
    body.appendChild(c); const ok = fits(); body.removeChild(c);
    if (ok){ best = mid; lo = mid+1; } else hi = mid-1;
  }
  if (best < 0) return null;
  const a = head(best);
  // avoid a lonely first line at the foot of a page
  if (minLines && el.tagName === "P"){
    body.appendChild(a);
    const lines = a.offsetHeight / (parseFloat(getComputedStyle(a).lineHeight) || 1e9);
    body.removeChild(a);
    if (lines < 1.6) return null;
  }
  const r = document.createRange(); r.setStart(pts[best].node, pts[best].offset); r.setEnd(el, el.childNodes.length);
  const b = el.cloneNode(false); b.appendChild(r.cloneContents());
  a.classList.add("split");
  b.classList.remove("dropcap","split"); b.classList.add("cont");
  if (el.tagName === "OL" || el.tagName === "UL"){
    const li = pts[best].node.parentElement.closest("li");
    let mid = false;
    if (li && el.contains(li)){ const r2 = document.createRange(); r2.setStart(li,0); r2.setEnd(pts[best].node, pts[best].offset); mid = r2.toString().trim() !== ""; }
    const firstLi = b.querySelector(":scope > li");
    if (mid && firstLi) firstLi.classList.add("cont-li");
    if (el.tagName === "OL"){
      const n = a.querySelectorAll(":scope > li").length;
      b.setAttribute("start", (parseInt(el.getAttribute("start")||"1",10)) + n - (mid ? 1 : 0));
    }
  }
  [a,b].forEach(x => x.querySelectorAll("li:empty").forEach(e => e.remove()));
  return [a, b];
}

function paginate(p){
  const host = $("#pages"); host.innerHTML = "";
  const pages = [];
  const make = () => {
    const slot = document.createElement("div"); slot.className = "slot";
    const page = document.createElement("article");
    page.className = "page " + (pages.length % 2 === 0 ? "recto" : "verso") + (pages.length === 0 ? " first" : "");
    page.innerHTML = '<div class="page-head"></div><div class="page-body prose"></div><div class="page-num"></div>';
    const body = page.querySelector(".page-body"); body.lang = p.lang;
    slot.appendChild(page); host.appendChild(slot); pages.push(page);
    return body;
  };
  let body = make();
  const fits = () => body.scrollHeight <= body.clientHeight + 1;
  const queue = [titleBlock(p), ...Array.from(p.frag.children)];
  queue.forEach(n => n.remove());

  let guard = 0;
  while (queue.length && guard++ < 50000){
    const el = queue.shift();
    body.appendChild(el);
    if (fits()) continue;
    body.removeChild(el);
    const empty = !body.firstChild;

    if (SPLITTABLE.test(el.tagName)){
      const parts = splitBlock(el, body, fits, !empty);
      if (parts){ body.appendChild(parts[0]); queue.unshift(parts[1]); body = make(); continue; }
    }
    if (empty){ body.appendChild(el); body = make(); continue; } // too big for any page: let it clip
    // keep headings with what follows
    const carry = [el];
    while (body.children.length > 1 && /^H[1-6]$/.test(body.lastElementChild.tagName)){
      carry.unshift(body.lastElementChild); body.removeChild(body.lastElementChild);
    }
    body = make();
    queue.unshift(...carry);
  }
  if (!body.firstChild && pages.length > 1){ host.lastElementChild.remove(); pages.pop(); }
  pages.forEach((pg, i) => {
    if (i > 0) pg.querySelector(".page-head").textContent = p.titleText;
    pg.querySelector(".page-num").textContent = i + 1;
  });
}

/* ---------- Rendering ---------- */
let fontsPromise = null;
function fontsReady(){
  if (!fontsPromise){
    const loads = ['400 16px "EB Garamond"','italic 400 16px "EB Garamond"','600 16px "EB Garamond"',
                   '500 16px "Cormorant Garamond"','italic 500 16px "Cormorant Garamond"']
      .map(f => document.fonts ? document.fonts.load(f) : Promise.resolve());
    fontsPromise = Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 2500))]).catch(()=>{});
  }
  return fontsPromise;
}

function scaleToFit(){
  const pageW = 148 * 96 / 25.4;
  const s = Math.min(1, (window.innerWidth - 24) / pageW);
  root.style.setProperty("--s", s.toFixed(4));
}

async function render(keepPlace){
  const se = document.scrollingElement;
  const ratio = keepPlace ? se.scrollTop / Math.max(1, se.scrollHeight - innerHeight) : 0;
  root.style.setProperty("--fs", SIZES_PX[st.size] + "px");
  root.style.setProperty("--fsA5", SIZES_PT[st.size] + "pt");
  $("#sizeLabel").textContent = st.mode === "a5" ? SIZES_PT[st.size] + "pt" : SIZES_PX[st.size] + "px";
  $("#modeScroll").setAttribute("aria-pressed", st.mode === "scroll");
  $("#modeA5").setAttribute("aria-pressed", st.mode === "a5");
  document.body.classList.toggle("a5", st.mode === "a5");

  if (!doc){
    $("#welcome").hidden = false; $("#bar").hidden = true; $("#column").hidden = true; $("#pages").hidden = true;
    document.title = "Reader"; return;
  }
  $("#welcome").hidden = true; $("#bar").hidden = false;
  const p = parse(doc.text, doc.name);
  document.title = p.titleText;
  await fontsReady();

  if (st.mode === "scroll"){
    $("#pages").hidden = true; $("#pages").innerHTML = "";
    const col = $("#column"); col.hidden = false; col.lang = p.lang;
    col.replaceChildren(titleBlock(p), p.frag);
  } else {
    $("#column").hidden = true; $("#column").innerHTML = "";
    $("#pages").hidden = false;
    scaleToFit();
    paginate(p);
  }
  if (keepPlace) se.scrollTop = ratio * (se.scrollHeight - innerHeight);
  else se.scrollTop = 0;
}

function load(text, name){
  doc = { text, name };
  if (text.length < 3_000_000) store.set("reader.doc", doc);
  render(false);
}

async function readFile(file){
  if (!file) return;
  load(await file.text(), file.name);
}

/* ---------- Theme ---------- */
const mq = matchMedia("(prefers-color-scheme: dark)");
const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
function applyTheme(){
  const t = st.theme || (mq.matches ? "dark" : "light");
  root.dataset.theme = t;
  $("#themeBtn").innerHTML = t === "dark" ? ICON_SUN : ICON_MOON;
}
mq.addEventListener?.("change", applyTheme);

/* ---------- Controls ---------- */
const openPicker = () => $("#file").click();
const setMode = m => { if (st.mode === m) return; st.mode = m; saveSettings(); render(false); };
const resize = d => { const n = Math.max(0, Math.min(SIZES_PX.length-1, st.size + d)); if (n === st.size) return; st.size = n; saveSettings(); render(true); };
const toggleTheme = () => { st.theme = root.dataset.theme === "dark" ? "light" : "dark"; saveSettings(); applyTheme(); };

$("#openBtn").onclick = openPicker;
$("#welcomeOpen").onclick = openPicker;
$("#file").onchange = e => { readFile(e.target.files[0]); e.target.value = ""; };
$("#modeScroll").onclick = () => setMode("scroll");
$("#modeA5").onclick = () => setMode("a5");
$("#smaller").onclick = () => resize(-1);
$("#bigger").onclick = () => resize(1);
$("#themeBtn").onclick = toggleTheme;
$("#printBtn").onclick = () => window.print();
$("#sampleBtn").onclick = () => load(SAMPLE, "sample.md");

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "+" || e.key === "=") resize(1);
  else if (e.key === "-" || e.key === "_") resize(-1);
  else if (e.key === "d" || e.key === "D") toggleTheme();
  else if (e.key === "p" || e.key === "P") setMode(st.mode === "a5" ? "scroll" : "a5");
  else if (e.key === "o" || e.key === "O") openPicker();
});

/* drag & drop anywhere */
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("drop"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("drop"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("drop"); readFile(e.dataTransfer.files[0]); });

/* toolbar tucks away while reading */
let lastY = 0;
addEventListener("scroll", () => {
  const y = scrollY; const bar = $("#bar");
  if (y > lastY + 6 && y > 120) bar.classList.add("hidden");
  else if (y < lastY - 6 || y < 120) bar.classList.remove("hidden");
  lastY = y;
}, { passive:true });
addEventListener("mousemove", e => { if (e.clientY < 70) $("#bar").classList.remove("hidden"); });

addEventListener("resize", () => { if (st.mode === "a5") scaleToFit(); });

/* ---------- Sample ---------- */
const SAMPLE = `---
title: The Lamplighter's Ledger
subtitle: A short story
author: Anonymous
---

Every evening at a quarter past six, Tomás climbed the iron ladder outside the municipal library and lit the lamp that nobody needed any more. The streetlights had been electric for forty years. The council had voted twice to remove the old fixture, and twice the vote had been lost in a drawer somewhere, which is how most things in that town were decided.

He kept a ledger. In it he wrote the date, the time of lighting, the weather, and one sentence about something he had seen from the top of the ladder. "Rain. A boy carrying a cello as if it were asleep." "Clear. The baker's daughter laughing at nothing." "Wind from the south. Somebody has painted the post office door green, and it is wrong, and I love it."

The ledger had grown to eleven volumes. He stored them on the lowest shelf of the reading room, between a broken atlas and a dictionary of birds, because the librarian had said that anything placed on a shelf long enough becomes a book, and anything that becomes a book belongs to everyone.

## The visitor

In October a woman arrived from the capital with a clipboard and a coat too thin for the season. She had been sent to make an inventory of *obsolete public assets*, and the lamp was on her list. She watched him climb, light the wick, and climb down again.

"It doesn't illuminate anything," she said.

"No," he agreed. "It's not that kind of lamp."

She wrote something on her clipboard. Then, because she was cold and the library was warm, she went inside and sat in the reading room until closing time. The next evening she came back. On the third evening Tomás found her on the lowest shelf's side of the room, the seventh volume of his ledger open on her knees, reading by the light of the window—which is to say, by the light of his lamp.

---

Her report, when it was finally filed, described the fixture as *a functioning historical installation of moderate cultural value*. It recommended that it be preserved, and that its keeper be paid, retroactively, for forty years of service.

The council lost that recommendation in a drawer as well. But on the first page of the twelfth volume there is an entry in a different hand: "Cold. A man on a ladder, lighting the only lamp in town that shows you where you are."
`;

/* ---------- Boot ---------- */
applyTheme();
async function boot(){
  const params = new URLSearchParams(location.search);
  const wanted = params.get("file");
  if (location.protocol.startsWith("http")){
    const candidates = wanted ? [wanted] : ["text.md","text.txt"];
    for (const f of candidates){
      try{
        const r = await fetch(f, { cache:"no-cache" });
        if (r.ok){ doc = { text: await r.text(), name: f.split("/").pop() }; break; }
      }catch{}
    }
  }
  if (!doc) doc = store.get("reader.doc");
  render(false);
}
boot();
})();
